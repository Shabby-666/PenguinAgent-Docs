theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  #locale: zh_CN
  icon:
    repo: fontawesome/brands/github
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
    - python
    - cpp
    - java
    - bash


markdown_extensions:
  - toc:
      permalink: True
  - footnotes
  - tables
  - admonition  # 提示块
  - meta  # 定义元数据，通过文章上下文控制，如disqus
  - pymdownx.caret  # 下划线上标
  - pymdownx.tilde  # 删除线下标
  - pymdownx.critic  # 增加删除修改高亮注释，可修饰行内或段落
  - pymdownx.details  # 提示块可折叠
  - pymdownx.inlinehilite  # 行内代码高亮
  - pymdownx.mark  # 文本高亮
  - pymdownx.smartsymbols  # 符号转换
  - pymdownx.superfences  # 代码嵌套在列表里
  - codehilite:    # 代码高亮，显示行号
      guess_lang: false
      linenums: true
#  - pymdownx.arithmatex  # 数学公式
  - pymdownx.betterem:  # 对加粗和斜体更好的检测
      # 只能限定在括号内：smart_enable: all 会把「中文词中间的 **」当成词内强调，
      # 结果 **加粗** 被原样输出，站点里所有行内加粗都会失效。
      smart_enable: brackets
#  - pymdownx.emoji:  # 表情
#      emoji_generator: !!python/name:pymdownx.emoji.to_svg
#  - pymdownx.magiclink  # 自动识别超链接
  - pymdownx.tasklist:  # 复选框checklist
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.tabbed:  # 多语言代码并列（=== "标签"）
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# hooks.py 在 on_config 阶段替换 toc 的 slugify，让中文标题的锚点 id 保留中文。
# 路径相对本文件解析，因此不依赖构建时的当前工作目录。
hooks:
  - hooks.py

repo_url: https://github.com/HuHoBot/PenguinAgent

repo_name: HuHoBotPenguin

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/highlight.min.js
  - javascripts/config.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/styles/default.min.css
