nav:
  - 主页: index.md
  - 命令列表: command.md
  - 快速开始: QuickStart/index.md
  - 绑定系统: Binding/index.md
  - AI Agent: Agent/index.md
  - 在线列表配置: OnlineList.md
  - 适配器开发:
      - 公共 API: develop/adapter-api.md
      - Spigot/Paper: develop/spigot.md
      - Nukkit-MOT (上游): develop/nukkit-mot.md
      - BungeeCord (上游): develop/bungeecord.md
